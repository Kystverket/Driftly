apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    service: repo
    app: full
    env: prod
    team: fyr
  name: full
  namespace: fyr-prod-repo
spec:
  maxReplicas: 5
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 90
          type: Utilization
      type: Resource
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: full
