apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: full
  namespace: fyr-prod-repo
  labels:
    service: repo
    app: full
    env: prod
    team: fyr
spec:
  hostnames:
    - fullexample.prod.corp.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: aks-istio-ingress
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          name: full
          port: 3000
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /frontend
              type: ReplacePrefixMatch
      matches:
        - path:
            type: PathPrefix
            value: /
