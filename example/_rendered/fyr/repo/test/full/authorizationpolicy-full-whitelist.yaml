apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: full-whitelist
  namespace: aks-istio-ingress
  labels:
    service: repo
    app: full
    env: test
    team: fyr
spec:
  action: DENY
  rules:
    - from:
        - source:
            notRemoteIpBlocks:
              - 10.100.100.10/32
      to:
        - operation:
            hosts:
              - fullexample.test.corp.cloud
