apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: outbund-full-test
  namespace: fyr-test-repo
  labels:
    service: repo
    app: full
    env: test
    team: fyr
spec:
  egress:
    - toFQDNs:
        - matchName: api.example.com
      toPorts:
        - ports:
            - port: "443"
    - toFQDNs:
        - matchPattern: '*.example.com'
      toPorts:
        - ports:
            - port: "443"
    - toEntities:
        - world
  endpointSelector:
    matchLabels:
      service: repo
      app: full
      env: test
