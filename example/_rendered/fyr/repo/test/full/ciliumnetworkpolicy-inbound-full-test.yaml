apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inbound-full-test
  namespace: fyr-test-repo
  labels:
    service: repo
    app: full
    env: test
    team: fyr
spec:
  endpointSelector:
    matchLabels:
      service: repo
      app: full
      env: test
  ingress:
    - fromEndpoints:
        - matchLabels:
            service: otherservice
            app: otherapp
            env: test
            io.kubernetes.pod.namespace: fyr-test-otherservice
      toPorts:
        - ports:
            - port: "3000"
