apiVersion: batch/v1
kind: Job
metadata:
  labels:
    service: repo
    app: job-example
    env: dev
    team: fyr
  name: job-example
  namespace: fyr-dev-repo
spec:
  template:
    metadata:
      labels:
        service: repo
        app: job-example
        env: dev
        team: fyr
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  service: repo
                  app: job-example
                  env: dev
                  team: fyr
              topologyKey: kubernetes.io/hostname
      containers:
        - image: ghcr.io/kystverket/repo/job-example:replacedbyargocmp
          name: job-example
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 10002
            runAsNonRoot: true
            runAsUser: 10002
            seccompProfile:
              type: RuntimeDefault
      imagePullSecrets:
        - name: corp-pull
      restartPolicy: Never
      securityContext:
        fsGroup: 10002
        runAsGroup: 10002
        runAsNonRoot: true
        runAsUser: 10002
