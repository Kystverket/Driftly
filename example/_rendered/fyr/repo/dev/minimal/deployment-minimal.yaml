apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: repo
    app: minimal
    env: dev
    team: fyr
  name: minimal
  namespace: fyr-dev-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      service: repo
      app: minimal
      env: dev
      team: fyr
  template:
    metadata:
      labels:
        service: repo
        app: minimal
        env: dev
        team: fyr
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  service: repo
                  app: minimal
                  env: dev
                  team: fyr
              topologyKey: kubernetes.io/hostname
      containers:
        - image: ghcr.io/kystverket/repo/minimal:replacedbyargocmp
          name: minimal
          ports:
            - containerPort: 8080
          resources:
            limits:
              ephemeral-storage: 64Mi
            requests:
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 10002
            runAsNonRoot: true
            runAsUser: 10002
            seccompProfile:
              type: RuntimeDefault
      imagePullSecrets:
        - name: corp-pull
      securityContext:
        fsGroup: 10002
        runAsGroup: 10002
        runAsNonRoot: true
        runAsUser: 10002
